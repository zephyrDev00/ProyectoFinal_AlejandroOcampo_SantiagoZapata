apiVersion: 1
groups:
  - orgId: 1
    name: vinilos-hourly
    folder: Operación
    interval: 1m
    rules:
      - uid: vinilos-paro-60m
        title: Paro superior al 20% en últimos 60 min
        condition: C
        data:
          - refId: A
            datasourceUid: vinilosdw
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              datasource:
                type: postgres
                uid: vinilosdw
              editorMode: code
              format: table
              rawQuery: true
              rawSql: "SELECT m.machine_code, COALESCE(100*SUM(h.downtime_minutes)/NULLIF(SUM(h.planned_minutes),0),0) AS value FROM dw.fact_live_hour h JOIN dw.dim_machine m USING(machine_key) WHERE h.hour_start >= now()-interval '60 minutes' GROUP BY m.machine_code"
              refId: A
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              conditions:
                - evaluator:
                    params: [20]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: "Paro por encima del umbral operativo de demostración por línea"
          description: "Paro sobre el 20% de los minutos planificados de una línea en la última hora. Umbral provisional: validar con Producción."
        labels:
          severity: warning
          equipo: vinilos
